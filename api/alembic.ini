# Alembic Configuration File
# This file is the configuration file for Alembic.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration files
# NOTE: This is overridden by env.py using settings.DATABASE_URL
sqlalchemy.url = 

# Disable interpolation to handle special characters in passwords
sqlalchemy.url_placeholder = 

[db]
# This will be overridden by env.py
sqlalchemy.url = driver://user:password@localhost/dbname

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
